apiVersion: apps/v1
kind: Deployment

metadata:
  name: larareact
  namespace: default
  labels:
    app: larareact

spec:
  replicas: 1

  selector:
    matchLabels:
      app: larareact

  template:
    metadata:
      labels:
        app: larareact

    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-18-187-ubuntu

      containers:
        - name: laravel
          image: yoganugroho129/larareact-cicd:laravel-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: larareact-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        
        - name: nginx
          image: yoganugroho129/larareact-cicd:nginx-v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi